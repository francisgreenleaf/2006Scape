# Generic 2006Scape agent bridge HTTPS gateway template for Nginx.
#
# Replace AGENT_GATEWAY_HOST and certificate paths before use, or generate a
# filled copy with:
#   scripts/render-agent-bridge-gateway-config.py --server-name AGENT_GATEWAY_HOST --output /etc/nginx/sites-available/2006scape-agent-bridge.conf
#
# Keep AgentBridgeServer itself bound to 127.0.0.1 and do not expose TCP 43610.

limit_req_zone $binary_remote_addr zone=agent_bridge_claim:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=agent_bridge_api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=agent_bridge_tool:10m rate=120r/m;

log_format agent_bridge '$remote_addr forwarded=$http_x_forwarded_for '
                        'method=$request_method uri=$request_uri status=$status '
                        'bytes=$body_bytes_sent request_time=$request_time';

server {
    listen 443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl http2;
    server_name AGENT_GATEWAY_HOST;

    ssl_certificate /etc/letsencrypt/live/AGENT_GATEWAY_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/AGENT_GATEWAY_HOST/privkey.pem;

    access_log /var/log/nginx/2006scape-agent-bridge-access.log agent_bridge;
    error_log /var/log/nginx/2006scape-agent-bridge-error.log;

    client_max_body_size 64k;
    client_body_timeout 10s;
    keepalive_timeout 15s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;

    location = /agent/health {
        limit_except GET {
            deny all;
        }
        limit_req zone=agent_bridge_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:43610/agent/health;
    }

    location = /agent/session/claim {
        limit_except POST {
            deny all;
        }
        limit_req zone=agent_bridge_claim burst=20 nodelay;
        proxy_pass http://127.0.0.1:43610/agent/session/claim;
    }

    location = /agent/session/event {
        limit_except POST {
            deny all;
        }
        limit_req zone=agent_bridge_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:43610/agent/session/event;
    }

    location = /agent/personality/pending {
        limit_except GET {
            deny all;
        }
        limit_req zone=agent_bridge_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:43610/agent/personality/pending;
    }

    location = /agent/personality/complete {
        limit_except POST {
            deny all;
        }
        limit_req zone=agent_bridge_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:43610/agent/personality/complete;
    }

    location = /agent/personality/failed {
        limit_except POST {
            deny all;
        }
        limit_req zone=agent_bridge_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:43610/agent/personality/failed;
    }

    location = /agent/tool {
        limit_except POST {
            deny all;
        }
        limit_req zone=agent_bridge_tool burst=20 nodelay;
        proxy_pass http://127.0.0.1:43610/agent/tool;
    }

    location ^~ /agent/ {
        return 404;
    }

    location / {
        return 444;
    }
}

server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 444;
    }
}
