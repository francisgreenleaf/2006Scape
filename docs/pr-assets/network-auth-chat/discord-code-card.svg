<rect x="56" y="48" width="1488" height="120" rx="28" fill="#0f1722" stroke="#31435a" stroke-width="2"/>
<text x="88" y="105" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="50" font-weight="800" fill="#e6edf3" text-anchor="start">Code path: Discord becomes structured game chat</text>
<text x="90" y="145" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#94a3b8" text-anchor="start">Outside messages are normalized before they reach agents or players; callbacks never mutate gameplay directly.</text>
<rect x="74" y="220" width="1452" height="590" rx="24" fill="#0d1117" stroke="#30363d" stroke-width="3"/>
<rect x="74" y="220" width="1452" height="54" rx="24" fill="#161b22" stroke="#30363d" stroke-width="0"/>
<text x="112" y="255" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#94a3b8" text-anchor="start">DiscordAgentTransport.java</text>
<text x="110" y="318" font-family="Menlo, Courier, monospace" font-size="22" font-weight="400" fill="#6e7681" text-anchor="start"> 1</text>
<text x="165" y="318" font-family="Menlo, Courier, monospace" font-size="23" font-weight="400" fill="#ff7b72" text-anchor="start">private void handleDiscordMessage(...) {</text>
<text x="110" y="356" font-family="Menlo, Courier, monospace" font-size="22" font-weight="400" fill="#6e7681" text-anchor="start"> 2</text>
<text x="165" y="356" font-family="Menlo, Courier, monospace" font-size="23" font-weight="400" fill="#e6edf3" text-anchor="start">    if (event.getMessageAuthor().isBotUser()) return;</text>
<text x="110" y="394" font-family="Menlo, Courier, monospace" font-size="22" font-weight="400" fill="#6e7681" text-anchor="start"> 3</text>
<text x="165" y="394" font-family="Menlo, Courier, monospace" font-size="23" font-weight="400" fill="#e6edf3" text-anchor="start">    if (!config.acceptsChannel(event.getChannel())) return;</text>
<text x="110" y="470" font-family="Menlo, Courier, monospace" font-size="22" font-weight="400" fill="#6e7681" text-anchor="start"> 5</text>
<text x="165" y="470" font-family="Menlo, Courier, monospace" font-size="23" font-weight="400" fill="#d2a8ff" text-anchor="start">    DiscordIntent intent = DiscordIntent.parse(config, text);</text>
<text x="110" y="508" font-family="Menlo, Courier, monospace" font-size="22" font-weight="400" fill="#6e7681" text-anchor="start"> 6</text>
<text x="165" y="508" font-family="Menlo, Courier, monospace" font-size="23" font-weight="400" fill="#e6edf3" text-anchor="start">    if (!config.allowsIntent(intent)) return;</text>
<text x="110" y="584" font-family="Menlo, Courier, monospace" font-size="22" font-weight="400" fill="#6e7681" text-anchor="start"> 8</text>
<text x="165" y="584" font-family="Menlo, Courier, monospace" font-size="23" font-weight="400" fill="#79c0ff" text-anchor="start">    AgentChatService.INSTANCE.send(</text>
<text x="110" y="622" font-family="Menlo, Courier, monospace" font-size="22" font-weight="400" fill="#6e7681" text-anchor="start"> 9</text>
<text x="165" y="622" font-family="Menlo, Courier, monospace" font-size="23" font-weight="400" fill="#a5d6ff" text-anchor="start">        &quot;discord&quot;, author, config.agentName,</text>
<text x="110" y="660" font-family="Menlo, Courier, monospace" font-size="22" font-weight="400" fill="#6e7681" text-anchor="start">10</text>
<text x="165" y="660" font-family="Menlo, Courier, monospace" font-size="23" font-weight="400" fill="#e6edf3" text-anchor="start">        intent.toType, intent.toName, intent.channel,</text>
<text x="110" y="698" font-family="Menlo, Courier, monospace" font-size="22" font-weight="400" fill="#6e7681" text-anchor="start">11</text>
<text x="165" y="698" font-family="Menlo, Courier, monospace" font-size="23" font-weight="400" fill="#e6edf3" text-anchor="start">        intent.text, deliverToPlayers, Boolean.FALSE, id);</text>
<text x="110" y="736" font-family="Menlo, Courier, monospace" font-size="22" font-weight="400" fill="#6e7681" text-anchor="start">12</text>
<text x="165" y="736" font-family="Menlo, Courier, monospace" font-size="23" font-weight="400" fill="#ff7b72" text-anchor="start">}</text>
<rect x="1040" y="340" width="410" height="286" rx="18" fill="#111c27" stroke="#7ee787" stroke-width="2"/>
<text x="1070" y="386" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#7ee787" text-anchor="start">Safety boundary</text>
<text x="1072" y="435" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#e6edf3" text-anchor="start">[pass] bot messages ignored</text>
<text x="1072" y="473" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#e6edf3" text-anchor="start">[pass] channel allow-list checked</text>
<text x="1072" y="511" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#e6edf3" text-anchor="start">[pass] routing policy checked</text>
<text x="1072" y="549" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#e6edf3" text-anchor="start">[pass] text bounded and sanitized</text>
<text x="1072" y="587" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#e6edf3" text-anchor="start">[pass] player delivery queued</text>
<rect x="108" y="708" width="1376" height="78" rx="18" fill="#101820" stroke="#30363d" stroke-width="2"/>
<text x="138" y="744" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#94a3b8" text-anchor="start">Result: Discord, players, and agents share one normalized bus that can be logged,</text>
<text x="138" y="774" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#94a3b8" text-anchor="start">filtered, mirrored, tested, and kept away from direct gameplay mutation.</text>
</svg>